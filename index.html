<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogos de filmes</title>
    <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <div class="header-title">
            <i class="bi bi-film"></i>
            <h2>MOVIESPACE</h2>
        </div>
        <div class="header-buttons">
            <p>ALL FILMS</p>
            <button class="btn-login">
                Login
            </button>
        </div>
    </header>

    <div class="login-container hide-login">
        <div class="login-tittle">
            <i class="bi bi-film"></i>
            <h2>MOVIESPACE</h2>
        </div>
        <div class="login-inputs">
            <div class="login-inputs-email">
                <p>Email</p>
                <input type="email" id="input-email-login">
            </div>
            <div class="login-inputs-senha">
                <p>Senha</p>
                <input type="password" id="input-senha-login">
                <p id="erro-login"></p>
            </div>
        </div>

        <div class="enter-login">
            <button id="btn-login">
                Login
            </button>
            <p>Não tem conta ? <span id="register-login">Registre-se agora</span></p>
        </div>
    </div>

    <div class="cadastro-container hide">
        <div class="cadastro-tittle">
            <i class="bi bi-film"></i>
            <h2>MOVIESPACE</h2>
        </div>
        <div class="cadastro-inputs">
            <div class="cadastro-inputs-email">
                <p>Email</p>
                <input type="email" id="input-email-cadastro">
            </div>
            <div class="cadastro-inputs-senha">
                <p>Senha</p>
                <input type="password" id="input-senha-cadastro">
            </div>
        </div>

        <div class="enter-cadastro">
            <button id="btn-cadastro">
                Inscreva-se
            </button>
            <p>Já tem conta ? <span id="register-cadastro">Acesse agora</span></p>
            <button id="limpar">limpar</button>
        </div>
    </div>
</body>
</html>
